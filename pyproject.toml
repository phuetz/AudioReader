[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "audioreader"
version = "4.0.0"
description = "Convertit des livres Markdown en audiobooks haute qualite avec Kokoro TTS"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "AudioReader Contributors"},
]
keywords = ["tts", "audiobook", "kokoro", "text-to-speech", "french"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

dependencies = [
    "kokoro-onnx>=0.4.0",
    "soundfile>=0.12.0",
    "huggingface-hub>=0.20.0",
    "numpy>=1.20.0",
    "librosa>=0.10.0",
    "edge-tts>=6.1.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "python-multipart>=0.0.6",
    "pedalboard>=0.9.0",
    "mutagen>=1.47.0",
]

[project.optional-dependencies]
gui = ["gradio>=4.0.0"]
export = ["fpdf2>=2.7.0", "ebooklib>=0.18"]
dev = ["pytest", "pytest-cov", "ruff", "pre-commit"]
cloning = ["TTS", "torch", "torchaudio"]
chatterbox = ["chatterbox-tts", "torch", "torchaudio"]
subtitles = ["openai-whisper"]
langdetect = ["langdetect>=1.0.9"]
rich = ["rich>=13.0.0"]
all = [
    "audioreader[gui,export,dev,rich,langdetect]",
]

[project.scripts]
audioreader = "audio_reader:main"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "F401", "E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-q --tb=short"
